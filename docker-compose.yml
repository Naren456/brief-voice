services:
  backend:
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      PORT: 8000
      DATABASE_URL: file:/app/data/briefvoice.db
    ports:
      - "8000:8000"
    volumes:
      - briefvoice-db:/app/data
      - briefvoice-uploads:/app/uploads

volumes:
  briefvoice-db:
  briefvoice-uploads:
